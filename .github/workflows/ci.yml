name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest tests/ -q

  # The linter's whole claim is that a README scores the same everywhere, so the
  # repository's own README is scored on the same three runners as the suite.
  self:
    name: score its own README
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/readme_lint.py README.md --no-colour --strict
      - run: python scripts/readme_toc.py --check
      - run: python scripts/readme_badges.py --check

  generated:
    name: docs/rubric.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate and diff
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          gen = subprocess.run([sys.executable, "scripts/readme_lint.py", "--rules"],
                               capture_output=True, text=True, check=True).stdout.strip()
          on_disk = pathlib.Path("docs/rubric.md").read_text(encoding="utf-8")
          if gen != on_disk.strip():
              sys.exit("docs/rubric.md has drifted; regenerate it with "
                       "`python scripts/readme_lint.py --rules`")
          PY
